# 测试环境网关：全部后端服务 + ntfy + IM WebSocket
# 注意：使用变量 proxy_pass + Docker 内嵌 DNS，避免服务重建换 IP 后 502
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 200m;

    location / {
        set $svc http://web:3000;
        proxy_pass $svc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ { set $svc http://auth:8081; proxy_pass $svc; proxy_set_header Host $host; }
    location = /.well-known/openid-configuration { set $svc http://auth:8081; proxy_pass $svc; proxy_set_header Host $host; }
    location = /.well-known/jwks.json { set $svc http://auth:8081; proxy_pass $svc; proxy_set_header Host $host; }

    location /api/v1/im/     { set $svc http://im:8082;     proxy_pass $svc; proxy_set_header Host $host; }
    location /api/v1/task/   { set $svc http://task:8083;   proxy_pass $svc; proxy_set_header Host $host; }
    location /api/v1/doc/    { set $svc http://doc:8084;    proxy_pass $svc; proxy_set_header Host $host; }
    location /api/v1/event/  { set $svc http://event:8086;  proxy_pass $svc; proxy_set_header Host $host; }
    location /api/v1/drive/  { set $svc http://drive:8087;  proxy_pass $svc; proxy_set_header Host $host; }
    location /api/v1/notify/ { set $svc http://notify:8088; proxy_pass $svc; proxy_set_header Host $host; }

    # IM WebSocket
    location /ws/ {
        set $svc http://im:8082;
        proxy_pass $svc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # ntfy（订阅/发布）
    location /ntfy/ {
        set $svc http://ntfy:80;
        rewrite ^/ntfy/(.*)$ /$1 break;
        proxy_pass $svc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
