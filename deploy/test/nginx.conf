# 测试环境网关：全部后端服务 + ntfy + IM WebSocket
upstream web_upstream    { server web:3000; }
upstream auth_upstream   { server auth:8081; }
upstream im_upstream     { server im:8082; }
upstream task_upstream   { server task:8083; }
upstream doc_upstream    { server doc:8084; }
upstream event_upstream  { server event:8086; }
upstream drive_upstream  { server drive:8087; }
upstream notify_upstream { server notify:8088; }
upstream ntfy_upstream   { server ntfy:80; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 200m;

    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ { proxy_pass http://auth_upstream; proxy_set_header Host $host; }
    location = /.well-known/openid-configuration { proxy_pass http://auth_upstream; proxy_set_header Host $host; }
    location = /.well-known/jwks.json { proxy_pass http://auth_upstream; proxy_set_header Host $host; }

    location /api/v1/im/     { proxy_pass http://im_upstream;     proxy_set_header Host $host; }
    location /api/v1/task/   { proxy_pass http://task_upstream;   proxy_set_header Host $host; }
    location /api/v1/doc/    { proxy_pass http://doc_upstream;    proxy_set_header Host $host; }
    location /api/v1/event/  { proxy_pass http://event_upstream;  proxy_set_header Host $host; }
    location /api/v1/drive/  { proxy_pass http://drive_upstream;  proxy_set_header Host $host; }
    location /api/v1/notify/ { proxy_pass http://notify_upstream; proxy_set_header Host $host; }

    # IM WebSocket
    location /ws/ {
        proxy_pass http://im_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # ntfy（订阅/发布）
    location /ntfy/ {
        proxy_pass http://ntfy_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
