# 社团 OA 部署编排
#
# 说明：
# - 每个自研服务一个容器；S3/MinIO 不内置（使用已有 S3 或本地存储后端）
# - 尚未实现的业务服务（im/task/doc/meeting/event/drive）在对应里程碑追加
# - 生产环境请配合 .env 与证书（nginx/conf.d 挂载）使用
name: club-oa

x-service-common: &service-common
  restart: unless-stopped
  networks: [internal]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-club_oa}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: ['serve']
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:-http://localhost/ntfy}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ntfy_data:/var/lib/ntfy
    networks: [internal]

  auth:
    <<: *service-common
    build:
      context: ../services/auth
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-club_oa}
      AUTH_ISSUER: ${PUBLIC_BASE_URL:-http://localhost}
      WEB_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?required}
      DEV_MODE: ${DEV_MODE:-false}
      KEY_DIR: /data/keys
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - auth_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8081/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  notify:
    <<: *service-common
    build:
      context: ../services/notify
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-club_oa}
      AUTH_ISSUER: ${PUBLIC_BASE_URL:-http://localhost}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?required}
      REDIS_URL: redis://redis:6379
      NTFY_BASE_URL: http://ntfy:80
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NTFY_PUBLIC_URL: ${PUBLIC_BASE_URL:-http://localhost}/ntfy
      DEV_MODE: ${DEV_MODE:-false}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ntfy:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8088/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: club-oa/web:${WEB_TAG:-local}
    restart: unless-stopped
    build:
      context: ../apps/web
    environment:
      AUTH_SERVICE_URL: http://auth:8081
      NUXT_PUBLIC_APP_NAME: ${APP_NAME:-社团 OA}
      PORT: 3000
    networks: [internal]
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - gateway_cache:/var/cache/nginx
    depends_on:
      web:
        condition: service_started
      auth:
        condition: service_healthy
      notify:
        condition: service_healthy
    networks: [internal, proxy]

networks:
  internal:
    internal: true
  proxy:

volumes:
  pg_data:
  redis_data:
  ntfy_data:
  auth_data:
  gateway_cache:
