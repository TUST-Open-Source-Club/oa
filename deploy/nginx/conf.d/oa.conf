# 社团 OA 网关（HTTP；生产请配置证书后启用 443 server 段）

upstream web_upstream {
    server web:3000;
}
upstream auth_upstream {
    server auth:8081;
}
upstream notify_upstream {
    server notify:8088;
}
upstream ntfy_upstream {
    server ntfy:80;
}

# WebSocket 升级所需的连接头
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 200m;

    # Web 门户（BFF）
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 认证服务
    location /api/v1/auth/ {
        proxy_pass http://auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /.well-known/openid-configuration {
        proxy_pass http://auth_upstream;
        proxy_set_header Host $host;
    }
    location = /.well-known/jwks.json {
        proxy_pass http://auth_upstream;
        proxy_set_header Host $host;
    }

    # 通知服务
    location /api/v1/notify/ {
        proxy_pass http://notify_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ntfy（订阅 SSE/WS 与发布，均由 ACL/令牌保护）
    location /ntfy/ {
        proxy_pass http://ntfy_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # WebSocket（IM / 会议，服务上线后按路径追加）
    location /ws/ {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

