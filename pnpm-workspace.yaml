# 前端单 workspace：Web 门户、桌面端壳、共享库（packages/ui、packages/core）
packages:
  - 'apps/web'
  - 'apps/app/electron'
  - 'packages/*'

# 允许执行安装脚本的依赖（pnpm 11 用 allowBuilds 映射；占位符视为未允许）
# - esbuild：Vite / Nuxt 构建需要平台二进制，Web 构建必需
# - electron：运行时下载约 100MB，只有桌面端开发/打包需要；默认关闭以保持
#   install 轻量与可复现，需要时执行：pnpm --filter club-oa-electron rebuild electron
allowBuilds:
  esbuild: true
  electron: false

strictDepBuilds: false
